<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>🎄 Engerl & Bengerl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      background-image: url("lappenweihnachten.jpeg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #173e31;

      font: 16px system-ui, sans-serif;
      color: #173e31;
    }

    /* Keine große weiße Box mehr */
    main {
      box-sizing: border-box;
      width: min(90vw, 520px);
      padding: 20px;
      text-align: center;
    }

    /* Hintergrund nur direkt hinter den Texten */
    h1,
    main > p,
    #result > div,
    #result > p,
    #result > strong,
    footer {
      background: rgba(255, 245, 220, 0.85);
      padding: 8px 14px;
      border-radius: 10px;

      width: fit-content;
      max-width: 100%;
      box-sizing: border-box;

      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      margin-top: 0;
    }

    /* Bereich für die Entschlüsselung */
    #result {
      margin-top: 25px;
      font-size: 1.3rem;
    }

    /* Hintergrund für den anfänglichen Ladetext */
    #result:empty {
      display: none;
    }

    /* Name des Bengerls */
    #result strong {
      display: table;
      margin: 12px auto 0;
      font-size: 2rem;
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #62736a;
    }
  </style>
</head>

<body>
  <main>

    <h1>🎄 Engerl & Bengerl</h1>

    <p>
      Hier erfährst du, für welchen Lappen
      du dieses Jahr berappen musst.
    </p>

    <div id="result" aria-live="polite">
      <div>Dein Bengerl wird entschlüsselt … 🎁</div>
    </div>

    <footer>
      Viel Freude beim Lappen Wichteln! ✨
    </footer>

  </main>

  <!-- Verschlüsselte Zuordnungen -->
  <script src="zuweisungen.js"></script>

  <script>
    const result = document.getElementById("result");

    // Base64URL in Bytes umwandeln
    function fromBase64Url(text) {
      const base64 = text
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const binary = atob(base64);

      return Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
      );
    }

    // Persönlichen Link entschlüsseln
    async function showBengerl() {
      try {
        if (typeof ZUWEISUNGEN === "undefined") {
          throw new Error(
            "Die Auslosung wurde noch nicht hochgeladen."
          );
        }

        // Linkformat: #Kennung.Schluessel
        const fragment = location.hash.slice(1);
        const parts = fragment.split(".");

        if (
          parts.length !== 2 ||
          !parts[0] ||
          !parts[1]
        ) {
          throw new Error(
            "Bitte öffne deinen persönlichen Einladungslink."
          );
        }

        const [kennung, schluessel] = parts;

        const eintrag = ZUWEISUNGEN[kennung];

        if (!eintrag) {
          throw new Error(
            "Dieser Einladungslink ist ungültig."
          );
        }

        const keyBytes = fromBase64Url(schluessel);

        if (keyBytes.length !== 32) {
          throw new Error("Ungültiger Schlüssel.");
        }

        // AES-Schlüssel importieren
        const key = await crypto.subtle.importKey(
          "raw",
          keyBytes,
          "AES-GCM",
          false,
          ["decrypt"]
        );

        // Zuordnung entschlüsseln
        const entschluesselt =
          await crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: fromBase64Url(eintrag.iv)
            },
            key,
            fromBase64Url(eintrag.daten)
          );

        const daten = JSON.parse(
          new TextDecoder().decode(entschluesselt)
        );

        // Bisherigen Inhalt entfernen
        result.replaceChildren();

        // Begrüßung
        const begruessung =
          document.createElement("div");

        begruessung.textContent =
          `Hallo ${daten.name}! ✨`;

        // Beschreibung
        const beschreibung =
          document.createElement("p");

        beschreibung.textContent =
          "Du beschenkst dieses Jahr:";

        // Name des Bengerls
        const name =
          document.createElement("strong");

        name.textContent = daten.bengerl;

        // Alles anzeigen
        result.append(
          begruessung,
          beschreibung,
          name
        );

      } catch (error) {
        console.error(error);

        result.replaceChildren();

        const meldung = document.createElement("div");

        meldung.textContent =
          error.message ===
            "Bitte öffne deinen persönlichen Einladungslink." ||
          error.message ===
            "Die Auslosung wurde noch nicht hochgeladen."
            ? error.message
            : "Dieser Link ist ungültig oder konnte nicht entschlüsselt werden.";

        result.append(meldung);
      }
    }

    // Beim Laden entschlüsseln
    showBengerl();

    // Auch bei einem Linkwechsel aktualisieren
    window.addEventListener(
      "hashchange",
      showBengerl
    );
  </script>
</body>
</html>
