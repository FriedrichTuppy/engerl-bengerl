<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎄 Engerl & Bengerl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      background-image: url("lappenweihnachten.jpeg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #173e31;

      font: 16px system-ui, sans-serif;
      color: #173e31;
    }

    main {
      box-sizing: border-box;
      width: min(90vw, 520px);
      padding: 40px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      box-shadow: 0 12px 42px #173e3120;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    #result {
      margin-top: 25px;
      font-size: 1.3rem;
    }

    #result strong {
      display: block;
      margin-top: 12px;
      font-size: 2rem;
    }

    footer {
      margin-top: 25px;
      font-size: .85rem;
      color: #62736a;
    }
  </style>
</head>

<body>
  <main>
    <h1>🎄 Engerl & Bengerl</h1>

    <p>Hier erfährst du, für welchen Lappen du dieses Jahr berappen musst.</p>

    <div id="result" aria-live="polite">
      Dein Bengerl wird entschlüsselt … 🎁
    </div>

    <footer>Viel Freude beim Lappen Wichteln! ✨</footer>
  </main>

  <script src="zuweisungen.js"></script>

  <script>
    const result = document.getElementById("result");

    function fromBase64Url(text) {
      const base64 = text.replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(base64);

      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    async function showBengerl() {
      try {
        if (typeof ZUWEISUNGEN === "undefined") {
          throw new Error("Die Auslosung wurde noch nicht hochgeladen.");
        }

        // Linkformat: #Kennung.Schluessel
        const fragment = location.hash.slice(1);
        const parts = fragment.split(".");

        if (parts.length !== 2 || !parts[0] || !parts[1]) {
          throw new Error("Bitte öffne deinen persönlichen Einladungslink.");
        }

        const [kennung, schluessel] = parts;
        const eintrag = ZUWEISUNGEN[kennung];

        if (!eintrag) {
          throw new Error("Dieser Einladungslink ist ungültig.");
        }

        const keyBytes = fromBase64Url(schluessel);

        if (keyBytes.length !== 32) {
          throw new Error("Ungültiger Schlüssel.");
        }

        const key = await crypto.subtle.importKey(
          "raw",
          keyBytes,
          "AES-GCM",
          false,
          ["decrypt"]
        );

        const entschluesselt = await crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: fromBase64Url(eintrag.iv)
          },
          key,
          fromBase64Url(eintrag.daten)
        );

        const daten = JSON.parse(
          new TextDecoder().decode(entschluesselt)
        );

        result.replaceChildren();

        const begruessung = document.createElement("div");
        begruessung.textContent = `Hallo ${daten.name}! ✨`;

        const beschreibung = document.createElement("p");
        beschreibung.textContent = "Du beschenkst dieses Jahr:";

        const name = document.createElement("strong");
        name.textContent = daten.bengerl;

        result.append(begruessung, beschreibung, name);

      } catch (error) {
  result.textContent = "Fehler: " + error.name + " – " + error.message;
  console.error(error);
}
    }

    showBengerl();

    window.addEventListener("hashchange", showBengerl);
  </script>
</body>
</html>
