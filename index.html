<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎄 Engerl & Bengerl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
    
      display: grid;
      place-items: center;
    
      background-image: url("lappenweihnachten.jpeg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #173e31;
    }

    main {
      box-sizing: border-box;
      width: min(90vw, 520px);
      padding: 40px;
      background: rgba(255, 255, 255, 0);
      border-radius: 22px;
      box-shadow: 0 12px 42px #173e3120;
    }

    h1 {
      margin-top: 0;
    }

    select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border-radius: 10px;
      font: inherit;
    }

    select {
      border: 1px solid #aabdb3;
      background: white;
    }

    button {
      border: none;
      background: #176747;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-size: 1.3rem;
    }

    #result strong {
      display: block;
      margin-top: 10px;
      font-size: 1.8rem;
    }

    footer {
      margin-top: 25px;
      font-size: .85rem;
      color: #62736a;
    }
  </style>
</head>

<body>
  <main>
    <h1>🎄 Engerl & Bengerl</h1>

    <p>Hier erfährst du, für welchen Lappen du dieses Jahr berappen musst.</p>

    <label for="person">Wie heißt du?</label>

    <select id="person">
      <option value="">Bitte Namen auswählen …</option>
    </select>

    <button id="reveal">🎁 Mein Bengerl anzeigen</button>

    <div id="result" aria-live="polite"></div>

    <footer>Viel Freude beim Lappen Wichteln! ✨</footer>
  </main>

  <!-- Gespeicherte Auslosung laden -->
  <script src="zuweisungen.js"></script>

  <script>
    const select = document.getElementById("person");
    const result = document.getElementById("result");

    if (typeof ZUWEISUNGEN === "undefined") {
      result.textContent = "Auslosung noch nicht vorhanden.";
    } else {
      Object.keys(ZUWEISUNGEN)
        .sort((a, b) => a.localeCompare(b, "de"))
        .forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          select.append(option);
        });
    }

    document.getElementById("reveal").addEventListener("click", () => {
      result.replaceChildren();

      if (!select.value) {
        result.textContent = "Bitte zuerst deinen Namen auswählen.";
        return;
      }

      result.append("✨ Du beschenkst dieses Jahr:");

      const strong = document.createElement("strong");
      strong.textContent = ZUWEISUNGEN[select.value];

      result.append(strong);
    });
  </script>
</body>
</html>
