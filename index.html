<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>🎄 Engerl & Bengerl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      background-image: url("lappenweihnachten.jpeg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #173e31;

      font: 16px system-ui, sans-serif;
      color: white;
    }

    /* Kein Kasten um den Inhalt */
    main {
      box-sizing: border-box;
      width: min(90vw, 520px);
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      line-height: 1.5;
    }

    /* Klassische Texthinterlegung */
    .highlight {
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 0;
      border-radius: 0;

      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    #result {
      margin-top: 25px;
      font-size: 1.3rem;
    }

    #result p {
      margin: 15px 0;
    }

    #result strong {
      display: block;
      margin-top: 12px;
      font-size: 2rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <main>

    <h1>
      <span class="highlight">🎄 Engerl & Bengerl</span>
    </h1>

    <p>
      <span class="highlight">
        Hier erfährst du, für welchen Lappen du dieses Jahr berappen musst.
      </span>
    </p>

    <div id="result" aria-live="polite">
      <span class="highlight">
        Dein Bengerl wird entschlüsselt … 🎁
      </span>
    </div>

    <footer>
      <span class="highlight">
        Viel Freude beim Lappen Wichteln! ✨
      </span>
    </footer>

  </main>

  <script src="zuweisungen.js"></script>

  <script>
    const result = document.getElementById("result");

    function fromBase64Url(text) {
      const base64 = text
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const binary = atob(base64);

      return Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
      );
    }

    async function showBengerl() {
      try {
        if (typeof ZUWEISUNGEN === "undefined") {
          throw new Error(
            "Die Auslosung wurde noch nicht hochgeladen."
          );
        }

        // Linkformat: #Kennung.Schluessel
        const fragment = location.hash.slice(1);
        const parts = fragment.split(".");

        if (
          parts.length !== 2 ||
          !parts[0] ||
          !parts[1]
        ) {
          throw new Error(
            "Bitte öffne deinen persönlichen Einladungslink."
          );
        }

        const [kennung, schluessel] = parts;
        const eintrag = ZUWEISUNGEN[kennung];

        if (!eintrag) {
          throw new Error(
            "Dieser Einladungslink ist ungültig."
          );
        }

        const keyBytes = fromBase64Url(schluessel);

        if (keyBytes.length !== 32) {
          throw new Error("Ungültiger Schlüssel.");
        }

        // AES-Schlüssel importieren
        const key = await crypto.subtle.importKey(
          "raw",
          keyBytes,
          "AES-GCM",
          false,
          ["decrypt"]
        );

        // Zuordnung entschlüsseln
        const entschluesselt =
          await crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: fromBase64Url(eintrag.iv)
            },
            key,
            fromBase64Url(eintrag.daten)
          );

        const daten = JSON.parse(
          new TextDecoder().decode(entschluesselt)
        );

        // Alten Inhalt entfernen
        result.replaceChildren();

        // Hilfsfunktion für Texthinterlegung
        function highlight(text) {
          const span = document.createElement("span");
          span.className = "highlight";
          span.textContent = text;
          return span;
        }

        // Begrüßung
        const begruessung = document.createElement("div");
        begruessung.append(
          highlight(`Hallo ${daten.name}! ✨`)
        );

        // Beschreibung
        const beschreibung = document.createElement("p");
        beschreibung.append(
          highlight("Du beschenkst dieses Jahr:")
        );

        // Name des Bengerls
        const name = document.createElement("strong");
        name.append(
          highlight(daten.bengerl)
        );

        result.append(
          begruessung,
          beschreibung,
          name
        );

      } catch (error) {
        console.error(error);

        result.replaceChildren();

        const meldung = document.createElement("span");
        meldung.className = "highlight";

        meldung.textContent =
          error.message ===
            "Bitte öffne deinen persönlichen Einladungslink." ||
          error.message ===
            "Die Auslosung wurde noch nicht hochgeladen."
            ? error.message
            : "Dieser Link ist ungültig oder konnte nicht entschlüsselt werden.";

        result.append(meldung);
      }
    }

    showBengerl();

    window.addEventListener(
      "hashchange",
      showBengerl
    );
  </script>
</body>
</html>
