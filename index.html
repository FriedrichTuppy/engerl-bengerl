<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>🎄 Engerl & Bengerl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      background-color: #173e31;

      font: 16px system-ui, sans-serif;
      color: white;
    }

    /* Titel und Beschreibung oberhalb des Bildes */
    .intro {
      text-align: center;
      padding: 24px 20px 16px;
    }

    .intro h1 {
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .intro p {
      margin: 0;
      line-height: 1.7;
    }

    /* Weihnachtsbild als eigener Bereich */
    .bildbereich {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .bildbereich img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Auslosung mittig über dem Bild */
    main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      box-sizing: border-box;
      width: min(90%, 520px);
      text-align: center;
    }

    /* Oldschool-Texthinterlegung */
    .highlight {
      color: white;
      background-color: rgba(0, 0, 0, 0.75);

      padding: 0;
      border-radius: 0;

      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    #result {
      font-size: 1.3rem;
      line-height: 1.7;
    }

    #result p {
      margin: 15px 0;
    }

    #result strong {
      display: block;
      margin-top: 12px;
      font-size: 2rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    /* Anpassungen für kleine Bildschirme */
    @media (max-width: 600px) {
      .intro {
        padding-top: 18px;
      }

      .intro h1 {
        font-size: 1.5rem;
      }

      #result {
        font-size: 1rem;
      }

      #result strong {
        font-size: 1.5rem;
      }

      footer {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Titel oberhalb des Bildes -->
  <header class="intro">
    <h1>
      <span class="highlight">🎄 Engerl & Bengerl</span>
    </h1>

    <p>
      <span class="highlight">
        Hier erfährst du, für welchen Lappen du dieses Jahr berappen musst.
      </span>
    </p>
  </header>

  <!-- Weihnachtsbild mit Auslosung -->
  <div class="bildbereich">

    <img
      src="lappenweihnachten.jpeg"
      alt="Lappenweihnachten"
    >

    <main>
      <div id="result" aria-live="polite">
        <span class="highlight">
          Dein Bengerl wird entschlüsselt … 🎁
        </span>
      </div>

      <footer>
        <span class="highlight">
          Viel Freude beim Lappen Wichteln! ✨
        </span>
      </footer>
    </main>

  </div>

  <!-- Verschlüsselte Zuordnungen -->
  <script src="zuweisungen.js"></script>

  <script>
    const result = document.getElementById("result");

    function fromBase64Url(text) {
      const base64 = text
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const binary = atob(base64);

      return Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
      );
    }

    async function showBengerl() {
      try {
        if (typeof ZUWEISUNGEN === "undefined") {
          throw new Error(
            "Die Auslosung wurde noch nicht hochgeladen."
          );
        }

        // Linkformat: #Kennung.Schluessel
        const fragment = location.hash.slice(1);
        const parts = fragment.split(".");

        if (
          parts.length !== 2 ||
          !parts[0] ||
          !parts[1]
        ) {
          throw new Error(
            "Bitte öffne deinen persönlichen Einladungslink."
          );
        }

        const [kennung, schluessel] = parts;
        const eintrag = ZUWEISUNGEN[kennung];

        if (!eintrag) {
          throw new Error(
            "Dieser Einladungslink ist ungültig."
          );
        }

        const keyBytes = fromBase64Url(schluessel);

        if (keyBytes.length !== 32) {
          throw new Error("Ungültiger Schlüssel.");
        }

        // AES-Schlüssel importieren
        const key = await crypto.subtle.importKey(
          "raw",
          keyBytes,
          "AES-GCM",
          false,
          ["decrypt"]
        );

        // Zuordnung entschlüsseln
        const entschluesselt =
          await crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: fromBase64Url(eintrag.iv)
            },
            key,
            fromBase64Url(eintrag.daten)
          );

        const daten = JSON.parse(
          new TextDecoder().decode(entschluesselt)
        );

        result.replaceChildren();

        // Hilfsfunktion für Texthinterlegung
        function highlight(text) {
          const span = document.createElement("span");
          span.className = "highlight";
          span.textContent = text;
          return span;
        }

        // Begrüßung
        const begruessung = document.createElement("div");
        begruessung.append(
          highlight(`Hallo ${daten.name}! ✨`)
        );

        // Beschreibung
        const beschreibung = document.createElement("p");
        beschreibung.append(
          highlight("Du beschenkst dieses Jahr:")
        );

        // Name des Bengerls
        const name = document.createElement("strong");
        name.append(
          highlight(daten.bengerl)
        );

        result.append(
          begruessung,
          beschreibung,
          name
        );

      } catch (error) {
        console.error(error);

        result.replaceChildren();

        const meldung = document.createElement("span");
        meldung.className = "highlight";

        meldung.textContent =
          error.message ===
            "Bitte öffne deinen persönlichen Einladungslink." ||
          error.message ===
            "Die Auslosung wurde noch nicht hochgeladen."
            ? error.message
            : "Dieser Link ist ungültig oder konnte nicht entschlüsselt werden.";

        result.append(meldung);
      }
    }

    showBengerl();

    window.addEventListener("hashchange", showBengerl);
  </script>

</body>
</html>
