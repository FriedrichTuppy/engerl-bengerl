<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎄 Engerl & Bengerl</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #e8f3ed, #fff7e7);
      font: 16px system-ui, sans-serif;
      color: #173e31;
    }

    main {
      box-sizing: border-box;
      width: min(90vw, 520px);
      background: white;
      border-radius: 22px;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: 0 12px 42px #173e3120;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    p { line-height: 1.5; }

    label {
      display: block;
      font-weight: 650;
      margin: 20px 0 8px;
    }

    select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #aabdb3;
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #176747;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
    }

    .result {
      margin-top: 22px;
      padding: 20px;
      background: #f0f8f1;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
    }

    .result strong {
      display: block;
      font-size: 1.7rem;
      margin-top: 8px;
    }

    .error { color: #a52a2a; }

    footer {
      margin-top: 24px;
      font-size: .8rem;
      color: #62736a;
    }
  </style>
</head>
<body>
  <main>
    <h1>🎄 Engerl & Bengerl</h1>
    <p>Hier erfährst du für welchen Lappen du berappen musst.</p>
    <label for="person">Wie heißt du?</label>
    <select id="person">
      <option value="">Bitte Namen auswählen …</option>
    </select>
    <button id="reveal">🎁 Mein Bengerl anzeigen</button>
    <div id="result" aria-live="polite"></div>
    <footer>Viel Freude beim Lappen Wichteln! ✨</footer>
  </main>

  <script>
    const ZUWEISUNGEN = {"c":"a","a":"d","d":"b","b":"c"};
    const select = document.getElementById('person');

    Object.keys(ZUWEISUNGEN)
      .sort((a, b) => a.localeCompare(b, 'de'))
      .forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.append(option);
      });

    document.getElementById('reveal').addEventListener('click', () => {
      const box = document.getElementById('result');
      box.replaceChildren();

      if (!select.value) {
        box.textContent = 'Bitte zuerst deinen Namen auswählen.';
        box.className = 'result error';
        return;
      }

      box.className = 'result';
      box.append(document.createTextNode('✨ Du beschenkst dieses Jahr:'));

      const strong = document.createElement('strong');
      strong.textContent = ZUWEISUNGEN[select.value];
      box.append(strong);
    });
  </script>
</body>
</html>
